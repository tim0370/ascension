<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascension</title>
<meta name="theme-color" content="#0E0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascension">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<style>html, body { background: #0E0E12; margin: 0; } .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #F4F4F6; font: 800 20px/1 'Arial Narrow', system-ui, sans-serif; letter-spacing: 4px; animation: spl 1.2s ease-in-out infinite alternate; } .splash svg { width: 56px; height: 56px; } @keyframes spl { from { opacity: .55; } to { opacity: 1; } }</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app"><div class="splash" aria-label="Chargement"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 41.3 14v20L24 44 6.7 34V14Z" fill="none" stroke="#E2C27A" stroke-width="4" stroke-linejoin="round"/></svg><span>ASCENSION</span></div></main>
<div id="rest"></div>
<div id="fan" aria-hidden="true"></div>
<button type="button" class="fab" id="fab" aria-label="Menu (garde le doigt dessus pour aller plus vite)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="7.5" cy="7.5" r="2.3"/><circle cx="16.5" cy="7.5" r="2.3"/><circle cx="7.5" cy="16.5" r="2.3"/><circle cx="16.5" cy="16.5" r="2.3"/></svg><svg class="fabx" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<div id="sheet"></div>
<div id="sheet2"></div>
<div id="toast"></div>
<script>
// Secours : si l'app ne démarre pas (fichier en cache cassé, erreur), on affiche le problème et un bouton pour tout recharger.
(function () {
  var errs = [];
  function note(m) { if (m && errs.length < 4) errs.push(String(m).slice(0, 300)); }
  window.addEventListener('error', function (e) { note(e.target && e.target.src ? 'Fichier non chargé : ' + e.target.src.split('/').pop() : (e.message || 'Erreur') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.message || e.reason)); });
  window.__repair = function () {
    var done = function () { location.replace('./?maj=' + Date.now()); };
    try {
      var p = [];
      if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
      if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
      Promise.all(p).then(done, done);
      setTimeout(done, 3000);
    } catch (e) { done(); }
  };
  setTimeout(function () {
    var main = document.getElementById('app');
    if (window.__ascOk || (main && main.children.length && !main.querySelector('.splash') && !errs.length)) return;
    var app = document.createElement('div');
    app.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0E0E12;overflow:auto;padding-top:env(safe-area-inset-top)';
    document.body.appendChild(app);
    app.innerHTML = '<section style="margin:40px 16px;padding:20px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#F4F2FB;font:15px/1.45 -apple-system,system-ui,sans-serif">'
      + '<div style="font-weight:700;font-size:19px;margin-bottom:6px">L’app n’a pas démarré</div>'
      + '<div style="opacity:.75;margin-bottom:14px">Tes données ne sont pas touchées. Touche le bouton pour recharger l’app depuis Internet.</div>'
      + '<button type="button" onclick="__repair()" style="width:100%;height:52px;border:0;border-radius:26px;background:#8468E8;color:#fff;font-weight:700;font-size:16px">Réparer l’app</button>'
      + (errs.length ? '<div style="margin-top:14px;font:12px/1.4 ui-monospace,monospace;opacity:.6;word-break:break-word">' + errs.map(function (m) { return m.replace(/[<>&]/g, ''); }).join('<br>') + '</div>' : '')
      + '</section>';
  }, 5000);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
