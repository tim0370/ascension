<div id="toast"></div>
<script>
// Secours : si l'app ne démarre pas (fichier en cache cassé, erreur), on affiche le problème et un bouton pour tout recharger.
(function () {
  var errs = [];
  function note(m) { if (m && errs.length < 4) errs.push(String(m).slice(0, 300)); }
  window.addEventListener('error', function (e) { note(e.target && e.target.src ? 'Fichier non chargé : ' + e.target.src.split('/').pop() : (e.message || 'Erreur') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.message || e.reason)); });
  window.__repair = function () {
    var done = function () { location.replace('./?maj=' + Date.now()); };
    try {
      var p = [];
      if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
      if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
      Promise.all(p).then(done, done);
      setTimeout(done, 3000);
    } catch (e) { done(); }
  };
  setTimeout(function () {
    var main = document.getElementById('app');
    if (window.__ascOk || (main && main.children.length && !errs.length)) return;
    var app = document.createElement('div');
    app.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0D0A18;overflow:auto;padding-top:env(safe-area-inset-top)';
    document.body.appendChild(app);
    app.innerHTML = '<section style="margin:40px 16px;padding:20px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#F4F2FB;font:15px/1.45 -apple-system,system-ui,sans-serif">'
      + '<div style="font-weight:700;font-size:19px;margin-bottom:6px">L’app n’a pas démarré</div>'
      + '<div style="opacity:.75;margin-bottom:14px">Tes données ne sont pas touchées. Touche le bouton pour recharger l’app depuis Internet.</div>'
      + '<button type="button" onclick="__repair()" style="width:100%;height:52px;border:0;border-radius:26px;background:#8468E8;color:#fff;font-weight:700;font-size:16px">Réparer l’app</button>'
      + (errs.length ? '<div style="margin-top:14px;font:12px/1.4 ui-monospace,monospace;opacity:.6;word-break:break-word">' + errs.map(function (m) { return m.replace(/[<>&]/g, ''); }).join('<br>') + '</div>' : '')
      + '</section>';
  }, 5000);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
